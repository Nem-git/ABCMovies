# ABCMovies instance configuration (example).
# Copy to config/instance.yaml (gitignored) and adjust for your instance.
# Only variable NAMES are documented here; values live in .env (see .env.example).
# See docs/ENVIRONMENT.md §6 for the config and secrets conventions.

core:
  # Inbound API bind address (gRPC, docs/PLAN.md §8).
  api:
    bind: '127.0.0.1:8443'

auth:
  # Enabled authentication methods (used by CompositeAuthenticator).
  # Each entry maps to a proto oneof field in SignUpRequest/LoginRequest.
  methods:
    - password
  # Session token TTL (Go duration string). Default: 168h (7 days).
  token-ttl: 168h
  # Where unwrapped per-session data-encryption keys live.
  #   memory (default): process memory only; nothing persists, but users
  #     must log in again after a restart.
  #   encrypted-store: persisted in the sessions store sealed with the
  #     vault cipher (no plaintext key material reaches disk either way).
  #     When using encrypted-store, a pinned hex vault key (non-generated) is
  #     required to survive restarts. If vault-key is 'generated' and
  #     dek-cache is 'encrypted-store', boot will fail.
  dek-cache: memory

# Instance-wide usage policy (docs/PLAN.md §7.2, the enforcement vocabulary
# from docs/TECHNICAL-DECISIONS.md §1.34): a limit-type => value map. Absent
# keys inherit the shipped defaults; unknown keys or malformed values fail
# startup loudly — never run silently unconfined. Enforced in v1:
# concurrentStreams only; bandwidth/encode/pacing/* keys are validated,
# recorded on every delivery job, and enforced by their own milestones.
# policy:
#   concurrentStreams: 3
#   bandwidth: unlimited
#   encode: disabled

# Delivery engine knobs (docs/PLAN.md §7.2, §9.1). Absent keys inherit the
# shipped defaults recorded in TECHNICAL-DECISIONS.md §1.14; a malformed or
# non-positive duration aborts startup with the key named.
#   on-cap-change: what lowering an account's concurrent-stream cap does to
#     the sessions already running on it.
#     new-sessions-only (default) — running streams finish, and the new cap
#       applies from the next session.
#     enforce-now — the excess sessions end immediately, oldest first.
#   A user may override this per account. An unknown value fails startup.
# delivery:
#   on-cap-change: new-sessions-only
#   # Zombie cap: a session with no liveness proof ends after this.
#   session-ttl: 24h
#   heartbeat:
#     # How often a play session's frontend must prove liveness. Published
#     # to clients via GetInstanceInfo — clients never hardcode it.
#     interval: 30s
#     # Server-side slack before a missed heartbeat ends the session.
#     grace: 90s
#
# Library matching (docs/PLAN.md §5.3).
# library:
#   # Leading articles dropped when titles are normalized for matching.
#   # Set this BEFORE the first sync: the item registry's normalized-title
#   # index is built with the list in effect at write time, so changing it
#   # on a populated instance requires rebuilding the identity store.
#   # An explicit empty list (articles: []) drops no articles.
#   articles: [the, a, an]
#
# M7 pacing (PLAN.md §7.2, TECHNICAL-DECISIONS.md §1.35): per-account budget
# keys in the account's policy map; the per-provider aggregate governor cap
# lives in the slot's options bag.
#   providers:
#     - adapter: stremio
#       id: stremio-archiveorg
#       options:
#         pacingRequestsPerSecond: "5"   # total ceiling across its accounts
#       accounts:
#         - id: archiveorg
#           policy:
#             pacingRequestsPerSecond: "2"
#             pacingMaxConcurrentPulls: "2"
#             pacingInterRequestDelay: 200ms
#             pacingRetries: "2"

stores:
  # One backend per store class (docs/PLAN.md §2.4). Classes whose loss costs
  # user data or breaks the "restart continues" promise default to disk here;
  # changing any of them to in-memory makes a throwaway instance, and boot
  # says so per class. Each class has a default file path to prevent
  # collisions when multiple stores use "local-file" (e.g. data/caches.db,
  # data/vault.db).
  # The merged per-user library cache — safe to lose, so it stays cheap and
  # ephemeral unless you opt into restart-speed.
  caches:
    backend: in-memory
    # path: data/caches.db  # default
  vault:
    backend: local-file
    # path: data/vault.db  # default
    # vault-key: generated  # or 64 hex chars for a stable key. Generate
    # one with: openssl rand -hex 32 — it seals logins, account sessions
    # and any encrypted data-key cache, so losing it makes all three
    # unreadable.
  watch-history:
    backend: local-file
    # path: data/watch-history.db  # default
  jobs:
    backend: local-file
    # path: data/jobs.db  # default
  # Deliberately ephemeral: access tokens and unwrapped data keys are
  # re-minted, not recovered; a restart signs everyone back in.
  sessions:
    backend: in-memory
    # path: data/sessions.db  # default
  users:
    backend: local-file
    # path: data/users.db  # default
  # The account source cache (docs/PLAN.md §5.4) — what each linked account
  # carries. Durable by default; rebuilding from the provider is the fallback.
  source-cache:
    backend: local-file
    # path: data/source-cache.db  # default
  # The global per-title metadata cache (docs/PLAN.md §2.4, §5.2) — enriched
  # records plus their external-ID aliases. Durable is recommended; losing it
  # only costs re-fetching from catalogue slots.
  metadata-cache:
    backend: local-file
    # path: data/metadata-cache.db  # default

  # Instance settings (Batch 5) — durable record of operator settings. Values
  # are re-seedable from config at boot.
  settings:
    backend: local-file
    # path: data/settings.db  # default
  # Slot health (Batch 6) — probe results for provider slots.
  slot-health:
    backend: local-file
    # path: data/slot-health.db  # default

# Enrichment pipeline tuning (docs/TECHNICAL-DECISIONS.md §1.28, §1.29).
# Absent keys fall back to the documented defaults.
# enrichment:
#   drain-cadence: 15m  # default; how often the worker checks the queue
