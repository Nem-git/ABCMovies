// Library service: sync a connected source's library and present titles for
// browsing, search, and detail. Build 1: Jellyfin-first, single-source,
// instance-scope. Credentials are input-only and never persisted, returned,
// or logged.
//
// Session credential cache (Build 1): when a request that needs source
// credentials carries none, the core reuses the credentials this user entered
// earlier (held in memory only — never written to the store, never logged,
// cleared on restart; sliding 12h expiry, refreshed on use). Note this
// cache is keyed by user_id: it is per-user, per-process, and shared by all
// sessions of that user. If none are cached, the call fails with
// FailedPrecondition and the UI asks for credentials. This is deliberately
// in-memory only; DEC-003 (Build 2) decides encrypted at-rest custody later.
// The credential-resolution point is the single place that changes when
// DEC-003 lands.
syntax = "proto3";

package abcmovies.library.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Nem-git/ABCMovies/gen/go/abcmovies/library/v1;libraryv1";

service LibraryService {
  // SyncSource refreshes the library snapshot for a connected source.
  // Credentials: if present they are used for this call and cached in memory
  // for the session; if absent the session cache is reused. If neither is
  // available, the call fails with FailedPrecondition. Nothing is persisted.
  rpc SyncSource(SyncSourceRequest) returns (SyncSourceResponse);

  // ListTitles returns titles from the reachable library (browse).
  rpc ListTitles(ListTitlesRequest) returns (ListTitlesResponse);

  // SearchTitles returns titles matching a query across the reachable library.
  rpc SearchTitles(SearchTitlesRequest) returns (SearchTitlesResponse);

  // GetTitle returns one title with detail and availability.
  rpc GetTitle(GetTitleRequest) returns (GetTitleResponse);

  // CreatePlayTicket mints a short-lived, item-scoped, opaque ticket for
  // streaming a title to an HTTP client. Credentials behave exactly as in
  // SyncSource: supplied credentials are cached in memory for the session;
  // omitted credentials reuse the session cache; if neither is available the
  // call fails with FailedPrecondition. The ticket binds the actor and title
  // and expires quickly (see ResolvePlayTicket). Series are refused in
  // Build 1 (only movies are playable).
  rpc CreatePlayTicket(CreatePlayTicketRequest) returns (CreatePlayTicketResponse);

  // ResolvePlayTicket validates a ticket and returns what the HTTP edge
  // needs to proxy the upstream stream. It is a server-to-server call: the
  // response carries a source access token and must never reach a browser.
  // Returns NotFound for unknown, expired, or foreign-actor tickets (the
  // error is deliberately uniform).
  rpc ResolvePlayTicket(ResolvePlayTicketRequest) returns (ResolvePlayTicketResponse);
}

enum SyncOutcome {
  SYNC_OUTCOME_UNSPECIFIED = 0;
  SYNC_OUTCOME_SUCCESS = 1;
  SYNC_OUTCOME_PARTIAL = 2; // some titles synced; prior snapshot retained where needed
  SYNC_OUTCOME_FAILED = 3;  // sync could not complete; prior snapshot retained
}

enum TitleKind {
  TITLE_KIND_UNSPECIFIED = 0;
  TITLE_KIND_MOVIE = 1;
  TITLE_KIND_SERIES = 2;
  TITLE_KIND_OTHER = 3;
}

enum AvailabilityState {
  AVAILABILITY_STATE_UNSPECIFIED = 0;
  AVAILABILITY_STATE_AVAILABLE = 1;   // in latest snapshot of a reachable source
  AVAILABILITY_STATE_UNAVAILABLE = 2; // not currently accessible
}

// PasswordCredentials carries a username/password for source access. Input only.
message PasswordCredentials {
  string username = 1;
  string password = 2;
}

// SourceSyncState is the per-source sync/freshness state (safe, non-sensitive).
message SourceSyncState {
  string source_id = 1;
  string source_display_name = 2;
  SyncOutcome last_outcome = 3;
  google.protobuf.Timestamp last_synced_at = 4; // unset if never synced
  string detail = 5;         // safe, actionable
  int32 title_count = 6;     // titles in the current snapshot for this source
}

// Title is a non-sensitive library title (summary or detail fields populated as
// relevant). Build 1: one source per title.
message Title {
  string title_id = 1;           // opaque internal ID
  string source_id = 2;
  string source_display_name = 3;
  string external_id = 4;        // upstream item ID (non-secret)
  string name = 5;
  TitleKind kind = 6;
  int32 year = 7;                // 0 if unknown
  string overview = 8;           // may be empty in list results
  AvailabilityState availability = 9;
  string availability_detail = 10; // safe, actionable
}

message SyncSourceRequest {
  string actor_user_id = 1;
  string source_id = 2;
  oneof credentials {            // input only; omit to reuse the session cache
    PasswordCredentials password = 3;
    string api_key = 4;
  }
}

message SyncSourceResponse {
  string source_id = 1;
  SyncOutcome outcome = 2;
  SourceSyncState state = 3;
}

message ListTitlesRequest {
  string actor_user_id = 1;
  int32 limit = 2;   // 0 = server default
  int32 offset = 3;  // 0-based
}

message ListTitlesResponse {
  repeated Title titles = 1;
  repeated SourceSyncState sync_states = 2; // per-source freshness (Build 1: one)
  int32 total_count = 3;
}

message SearchTitlesRequest {
  string actor_user_id = 1;
  string query = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message SearchTitlesResponse {
  repeated Title titles = 1;
  repeated SourceSyncState sync_states = 2;
  int32 total_count = 3;
}

message GetTitleRequest {
  string actor_user_id = 1;
  string title_id = 2;
}

message GetTitleResponse {
  Title title = 1;
}

message CreatePlayTicketRequest {
  string actor_user_id = 1;
  string title_id = 2;
  oneof credentials {            // input only; omit to reuse the session cache
    PasswordCredentials password = 3;
    string api_key = 4;
  }
}

message CreatePlayTicketResponse {
  string ticket = 1;             // opaque; carries no credentials
  google.protobuf.Timestamp expires_at = 2;
}

message ResolvePlayTicketRequest {
  string actor_user_id = 1;
  string ticket = 2;
}

message ResolvePlayTicketResponse {
  string title_id = 1;
  string source_id = 2;
  string stream_url = 3;         // upstream stream URL; safe to fetch server-side only
  string authorization = 4;      // upstream Authorization header — server-to-server only, never a browser
}
