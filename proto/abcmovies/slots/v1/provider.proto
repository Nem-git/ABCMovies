syntax = "proto3";

package abcmovies.slots.v1;

import "abcmovies/core/v1/library_entry.proto";

// The provider slot's whole-catalogue sync contract (docs/PLAN.md §3.1, §5.4):
// a library-class provider answers "what's in this account's library?" with a
// paginated list of its native items. The catalogue index is the browse
// capability of a library-class provider; search and produce-sources are
// separate capabilities declared only when implemented (PLAN.md §3.2).
//
// Items are availability plus identity material (PLAN.md §5.3): a stable
// provider-native key, what kind of title it is, the provider-supplied
// external IDs that count as authoritative identity assertions, and the
// item's content metadata — which carries the remaining matching evidence
// (title, year) plus whatever else the provider supplies. Seasons and
// episodes are deliberately absent — they are provider-native sub-items never
// merged or cross-corresponded; adding them later is an additive change
// (PLAN.md §3.4).

// ExternalId is one provider-supplied identity assertion in an external
// namespace (e.g. imdb → "tt0111161"). A matching provider-supplied ID alone
// is sufficient to merge (PLAN.md §5.3).
message ExternalId {
  // The identity namespace, lower-case (e.g. "imdb", "tmdb", "tvdb").
  string namespace = 1;
  // The identity value within the namespace.
  string value = 2;
}

// ItemKind fixes what kind of title the item is. Movies and series are the
// only mergeable kinds (PLAN.md §5.3); episodes and seasons are provider-
// native sub-items and are never part of this contract.
enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  // A single feature-length or short film.
  ITEM_KIND_MOVIE = 1;
  // A series; its seasons and episodes stay provider-native.
  ITEM_KIND_SERIES = 2;
}

// CatalogueItem is one provider-native catalogue entry: availability plus
// identity material. The core maps these onto LibraryEntries through the
// provider item registry (PLAN.md §5.3); the mapping is never done here.
message CatalogueItem {
  // The provider's stable native key for this item. Required.
  string native_id = 1;
  // What kind of title this is. Required.
  ItemKind kind = 2;
  // Provider-supplied external IDs — identity assertions, not guesses.
  repeated ExternalId external_ids = 3;
  abcmovies.core.v1.TitleMetadata metadata = 4;
}

// CatalogueSyncRequest asks for one page of an account's catalogue. Pages are
// opaque continuation tokens so the transport stays neutral about each
// provider's pagination mechanics (offsets, cursors, or otherwise).
message CatalogueSyncRequest {
  // The linked streaming-provider account whose library is enumerated. An
  // unknown account is an error, never an empty page.
  string account_id = 1;
  // Empty for the first page; otherwise the next_page_token of the previous
  // response.
  string page_token = 2;
}

// CatalogueSyncResponse carries one page of items. Iteration ends at the
// first response with an empty next_page_token.
message CatalogueSyncResponse {
  // The page's items, possibly empty (an empty library yields exactly one
  // empty, final page).
  repeated CatalogueItem items = 1;
  // Token for the next page; empty when this is the final page.
  string next_page_token = 2;
}

// ProviderService is the sync surface of a provider slot. A slot declares
// only capabilities whose fixture suite it has passed (PLAN.md §2.5, §3.4);
// whole-catalogue sync is declared as capability "browse" version 1.
service ProviderService {
  rpc CatalogueSync(CatalogueSyncRequest) returns (CatalogueSyncResponse);
}
