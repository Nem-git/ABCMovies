syntax = "proto3";

package abcmovies.core.v1;

// The meta-contract (docs/PLAN.md §3.3): the contract of contracts.
// Every slot answers CapabilityQuery first; nothing is assumed, everything is asked.

message CapabilityQueryRequest {}

message Capability {
  string name = 1;
  uint32 version = 2;
}

message CapabilityQueryResponse {
  repeated Capability capabilities = 1;
  // Declared per-capability operating policy, keyed by capability name
  // (e.g. "browse.sync-cadence" → a duration string). Additive in v1: slots
  // declare, the core reads; unknown keys are ignored. Values whose home is
  // the decision log are pinned there (TECHNICAL-DECISIONS.md), not here.
  map<string, string> policy = 2;
}

service MetaService {
  rpc CapabilityQuery(CapabilityQueryRequest) returns (CapabilityQueryResponse);
}
