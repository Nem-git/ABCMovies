syntax = "proto3";

package abcmovies.api.v1;

import "abcmovies/core/v1/event.proto";
import "abcmovies/core/v1/job.proto";
import "abcmovies/core/v1/library_entry.proto";
import "abcmovies/core/v1/media_source.proto";

// The inbound API service surface (docs/TECHNICAL-DECISIONS §1.3, PLAN.md §8).
// Clients reach in; the core never reaches out. Two communication styles:
// synchronous request-reply and server-streaming events.

service CoreService {
  // Synchronous: get a job's current state (PLAN.md §9.1).
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // Events: server-streaming subscription (PLAN.md §9.2).
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Auth: create a new user account (PLAN.md §7.6).
  rpc SignUp(SignUpRequest) returns (SignUpResponse);

  // Auth: authenticate and receive a session token (PLAN.md §7.6).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Library: the caller's derived library, one page at a time (PLAN.md §5,
  // §8). The optional query narrows the page to matching titles; an empty
  // query returns the whole library.
  rpc GetLibrary(GetLibraryRequest) returns (GetLibraryResponse);

  // Library: refresh the availability of specific items on one account
  // (PLAN.md §5.4: explicit and user-triggered, never a background sweep).
  rpc RefreshAvailability(RefreshAvailabilityRequest) returns (RefreshAvailabilityResponse);

  // Library: explicit, user-triggered live refresh of lazy providers
  // (PLAN.md §5.4: browse/search against the provider is the refresh).
  // Results feed the source-cache reconciler exactly like an idempotent
  // sync page, and availability-changed events fire per new item.
  rpc LiveSearch(LiveSearchRequest) returns (LiveSearchResponse);

  // Accounts: link a provider account by submitting credentials. The core
  // validates them by probing the provider before storing anything — it never
  // vaults material it has not confirmed works (PLAN.md §3.5).
  rpc LinkAccount(LinkAccountRequest) returns (LinkAccountResponse);

  // Accounts: list the accounts the caller can deliver from — the accounts
  // the caller linked plus the operator-declared ones (PLAN.md §7.5).
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // Accounts: remove a linked account, revoking its session (PLAN.md §7.5).
  // Operator-declared accounts cannot be removed through the API.
  rpc RemoveAccount(RemoveAccountRequest) returns (RemoveAccountResponse);

  // Accounts: change a linked account's settings after the fact — who may use
  // it and the owner's usage settings on it. Owner-only; operator-declared
  // accounts are read-only through the API (PLAN.md §7.1, §7.2, §7.5).
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);

  // Delivery: begin a play or download session and receive the delivery job
  // (PLAN.md §6, §9.1). Start is a plain "create" — each call makes a new
  // session; event idempotency is deferred (TECHNICAL-DECISIONS.md §1.30).
  rpc StartDelivery(StartDeliveryRequest) returns (StartDeliveryResponse);

  // Delivery: report a play session is still alive (PLAN.md §9.1). A paused
  // session still heartbeats, so it is not killed.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Delivery: the play menu for a session — every delivered track and its
  // relay pull URL (PLAN.md §6.1). The engine emits delivery-play-menu-ready
  // once the menu is staged; this RPC is the recovery query for subscribers
  // that missed the event or loaded late (PLAN.md §9.2).
  rpc GetPlayInfo(GetPlayInfoRequest) returns (GetPlayInfoResponse);
}

// GetJobResponse is one job's current state.
message RefreshAvailabilityRequest {
  // The account whose items to re-check. Required; must be reachable by the
  // caller (same reach gate as GetLibrary/StartDelivery).
  string account_id = 1;
  // Provider-native item ids to re-check. An empty list is an error: a lazy
  // provider has no catalogue to enumerate, so a call must be bounded.
  repeated string native_ids = 2;
}

message RefreshAvailabilityResponse {
  // Items the provider confirmed it still carries.
  int32 present = 1;
  // Requested items the provider no longer answers for (deleted from the
  // source cache, availability-changed events emitted).
  int32 removed = 2;
}

message LiveSearchRequest {
  // The user's text query. Required.
  string query = 1;
  // Optional slot ids; empty = every enabled lazy provider.
  repeated string providers = 2;
  // Max pages fetched per provider account. 0 means 2; over budget 429's fail one call, not the set.
  int32 page_limit = 3;
}

message LiveSearchResponse {
  repeated LiveSearchHit hits = 1;
  // provider slot id -> error when one provider failed mid-batch (partial
  // results, never downgrade).
  map<string, string> rejected = 2;
}

message LiveSearchHit {
  string provider = 1;
  string account_id = 2;
  string native_id = 3;
  string title = 4;
  string kind = 5;
  uint32 year = 6;
}

message GetJobRequest {
  // The job id to look up. Required.
  string job_id = 1;
}

message GetJobResponse {
  // The job, or absent when not found.
  abcmovies.core.v1.Job job = 1;
}

message SubscribeRequest {
  // Scope filters for this connection; a subscriber only sees events for
  // entities it is authenticated to see (PLAN.md §9.2).
  repeated string scopes = 1;
}

message SubscribeResponse {
  // A single event delivered to the subscriber.
  abcmovies.core.v1.EventEnvelope event = 1;
}

// --- Auth messages (PLAN.md §7.6) ---

message SignUpRequest {
  // The desired username. Required; must be unique per instance.
  string username = 1;

  // The authentication method and its parameters.
  oneof auth_method {
    PasswordSignUp password = 2;
  }
}

// Password-based sign-up. The server derives the password-KEK from the
// password using Argon2id (TECHNICAL-DECISIONS §1.11).
message PasswordSignUp {
  // The user's password. Required.
  bytes password = 1;
}

message SignUpResponse {
  // The newly created user ID.
  string user_id = 1;

  // A one-time recovery key (128-bit base32, 26 chars). Shown once;
  // the server never stores it (PLAN.md §7.6).
  string recovery_key = 2;

  // A session token for immediate use — signup logs the user in
  // (TECHNICAL-DECISIONS §1.12).
  string token = 3;
}

message LoginRequest {
  // The username. Required.
  string username = 1;

  // The authentication method and its parameters.
  oneof auth_method {
    PasswordLogin password = 2;
  }
}

// Password-based login. The server re-derives the password-KEK from the
// password using the stored salt, then verifies and mints a session token.
message PasswordLogin {
  // The user's password. Required.
  bytes password = 1;
}

message LoginResponse {
  // An opaque bearer token for API authentication (TECHNICAL-DECISIONS §1.12).
  string token = 1;

  // The authenticated user's ID, so a returning client can attribute
  // deliveries without having been the one to sign up.
  string user_id = 2;
}

// --- Library messages (PLAN.md §5, §8.1) ---

message GetLibraryRequest {
  // Continuation token for the next page; empty for the first page.
  string page_token = 1;
  // Optional filter: narrows the library to matching titles. Empty returns
  // the whole library. Matching is over the derived library's titles; see
  // TECHNICAL-DECISIONS.md for the search surface decision.
  string query = 2;
}

// LibraryItem pairs one library entry with the display metadata cached for it.
message LibraryItem {
  // The merged, canonical entry (PLAN.md §2.3, §5.3).
  abcmovies.core.v1.LibraryEntry entry = 1;
  // The cached display record (title, poster, description, ...) for the
  // entry's metadata_ref; absent when no metadata is cached yet (PLAN.md
  // §5.2). The frontend renders from this when present and falls back to the
  // entry alone otherwise.
  abcmovies.core.v1.TitleMetadata metadata = 2;
}

message GetLibraryResponse {
  // This page of the library.
  repeated LibraryItem items = 1;
  // Continuation token for the next page; empty when this is the last page.
  string next_page_token = 2;
}

// --- Account messages (PLAN.md §7.5) ---

message LinkAccountRequest {
  // The provider slot to link against (PLAN.md §3.2). Required.
  string provider = 1;
  // The provider's base URL. Required.
  string base_url = 2;

  // The authentication method and its parameters (PLAN.md §3.5). The closed
  // common set carries a discriminator so a generic frontend renders an
  // appropriate input; password is the first member.
  oneof auth_method {
    AccountPassword password = 3;
  }

  // How the linked account is shared (PLAN.md §5.1). Private by default: the
  // account feeds only its owner's library until they choose otherwise.
  AccountVisibility visibility = 4;

  // The host users this account is shared with. Required when visibility is
  // SHARED, ignored otherwise.
  repeated string shared_with = 5;

  // The owner's cap on concurrent streams from this account (PLAN.md §3.9).
  // Zero means unlimited. The delivery engine enforces it.
  uint32 max_concurrent_streams = 6;
}

// Password credentials for a linked account. The core authenticates against
// the provider before storing anything and keeps an authenticated session,
// not the password itself (PLAN.md §3.5).
message AccountPassword {
  // The account's username on the provider.
  string username = 1;
  // The account's password, sent once for the validating probe.
  bytes password = 2;
}

message LinkAccountResponse {
  // The linked account id, stable for the account's lifetime.
  string account_id = 1;
}

message ListAccountsRequest {}

// AccountStatus is the core's current view of an account's liveness.
enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  // The account's session is usable.
  ACCOUNT_STATUS_LINKED = 1;
  // The account's session has expired and needs re-linking (PLAN.md §7.5).
  ACCOUNT_STATUS_EXPIRED = 2;
}

// AccountVisibility is how an account is shared across host users (PLAN.md
// §5.1). Operator-declared accounts are host-provided and always PUBLIC;
// linked accounts start PRIVATE and the owner may widen them.
enum AccountVisibility {
  ACCOUNT_VISIBILITY_UNSPECIFIED = 0;
  // Only the owner can derive and deliver from this account.
  ACCOUNT_VISIBILITY_PRIVATE = 1;
  // The owner and the named shared_with users can.
  ACCOUNT_VISIBILITY_SHARED = 2;
  // Every host user can derive and deliver from this account.
  ACCOUNT_VISIBILITY_PUBLIC = 3;
}

// Account is one account the caller can deliver from.
message Account {
  // The account id.
  string account_id = 1;
  // The provider slot.
  string provider = 2;
  // The provider base URL.
  string base_url = 3;
  // True when the caller linked this account; operator-declared accounts are
  // read-only through the API.
  bool caller_linked = 4;
  // The account's session status.
  AccountStatus status = 5;
  // How the account is shared. Operator-declared accounts are PUBLIC.
  AccountVisibility visibility = 6;
  // The users an account is shared with; only populated for SHARED accounts.
  repeated string shared_with = 7;
  // The host user who linked this account; empty for operator-declared
  // accounts.
  string owner_user_id = 8;
  // The owner's concurrent-stream cap; zero means unlimited. Owner-visible
  // only — populated when the caller linked the account.
  uint32 max_concurrent_streams = 9;
  // This account's own choice for cap-change behaviour; UNSPECIFIED means it
  // inherits the instance default. Owner-visible only.
  CapChangePolicy cap_change_policy = 10;
  // What actually applies, resolved by the core from the account's own choice
  // and the instance default. Owner-visible only.
  CapChangePolicy effective_cap_change_policy = 11;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message RemoveAccountRequest {
  // The account to remove; must be caller-linked. Required.
  string account_id = 1;
}

message RemoveAccountResponse {}

message UpdateAccountRequest {
  // The account to update; must be caller-linked. Required.
  string account_id = 1;
  // Absent means sharing is unchanged. Present replaces sharing wholesale —
  // visibility and the member list always travel together, so a
  // half-specified sharing change cannot be expressed.
  AccountSharing sharing = 2;
  // Absent means unchanged; zero means unlimited.
  optional uint32 max_concurrent_streams = 3;
  // Absent means unchanged. When present it replaces the account's choice:
  // a known mode sets the account onto it, UNSPECIFIED clears the
  // override so the account follows the instance default again.
  optional CapChangePolicy cap_change_policy = 4;
}

message AccountSharing {
  // How the account is shared after the update.
  AccountVisibility visibility = 1;
  // The host users allowed when visibility is SHARED; required there,
  // ignored otherwise.
  repeated string shared_with = 2;
}

// CapChangePolicy is what a change to an account's concurrent-stream cap does
// to the sessions already running on it (docs/TECHNICAL-DECISIONS.md).
enum CapChangePolicy {
  // Inherit the instance default (delivery.on-cap-change).
  CAP_CHANGE_POLICY_UNSPECIFIED = 0;
  // Running streams finish; the new cap applies from the next session.
  CAP_CHANGE_POLICY_NEW_SESSIONS_ONLY = 1;
  // End the excess sessions now, oldest first.
  CAP_CHANGE_POLICY_ENFORCE_NOW = 2;
}

message UpdateAccountResponse {
  // The account as it now stands, as seen by its owner.
  Account account = 1;
}

// --- Delivery messages (PLAN.md §6, §9.1) ---

// The delivery goal: play delivers the whole menu for the player to choose
// from; download delivers a recipe into a container (PLAN.md §6.1, §6.3).
enum DeliveryGoal {
  DELIVERY_GOAL_UNSPECIFIED = 0;
  DELIVERY_GOAL_PLAY = 1;
  DELIVERY_GOAL_DOWNLOAD = 2;
}

message StartDeliveryRequest {
  // What to deliver and why.
  DeliveryGoal goal = 1;

  // The provider slot that resolves the manifest (PLAN.md §3.2). Required.
  string provider = 2;

  // The account whose session is used. Required.
  string account_id = 3;

  // The provider-native item to deliver. Required.
  string native_id = 4;

  // The sink this delivery drives (PLAN.md §6.4). Required.
  string sink = 5;

  // The selected target. For download it is the recipe's video target; for
  // play it selects a sink-compatibility remux/transcode target (PLAN.md
  // §6.3). Optional: the engine defaults it by the pipeline precedence chain.
  string selected_target = 6;

  // The target container. For download compose it wraps the recipe; for play
  // it is a remux container when the sink cannot consume the native one
  // (PLAN.md §6.3, §6.5). Optional.
  string container = 7;
}

message StartDeliveryResponse {
  // The delivery job; its id is the delivery session id (PLAN.md §9.1).
  abcmovies.core.v1.Job job = 1;
}

message HeartbeatRequest {
  // The delivery session id to keep alive. Required.
  string session_id = 1;
}

message HeartbeatResponse {
  // Echoes the session id, confirming it is alive (PLAN.md §9.1).
  string session_id = 1;
}

// --- Play menu messages (PLAN.md §6.1) ---

message GetPlayInfoRequest {
  // The delivery session to inspect. Required. A session's id is its
  // delivery job id (PLAN.md §9.1).
  string session_id = 1;
}

// PlayTrack is one delivered track with the relay URL that serves its bytes.
// The engine attaches the provider's auth when the relay is pulled, so the
// caller only ever sees the relay URL (PLAN.md §3.6).
message PlayTrack {
  // Stable track id within the session's menu.
  string track_id = 1;
  // The track's media properties, exactly one matching its media type.
  oneof media {
    abcmovies.core.v1.VideoTrack video = 2;
    abcmovies.core.v1.AudioTrack audio = 3;
    abcmovies.core.v1.SubtitleTrack subtitle = 4;
  }
  // The relay URL serving this track's bytes, under the stable /media/relay/
  // prefix; the frontend prepends its own origin (PLAN.md §3.6).
  string relay_url = 5;
}

message GetPlayInfoResponse {
  // The session's play menu. Empty until the menu is staged; the
  // delivery-play-menu-ready event announces when it is.
  repeated PlayTrack tracks = 1;
  // The source container, when known (e.g. "mkv", "mp4"). Empty otherwise.
  string container = 2;
}
