{{define "content"}}<h1>Hello, {{.Username}}</h1>
<p>You are signed in to ABCMovies.</p>
<p><a href="/library">Library</a> · <a href="/sources">Sources</a></p>
<form id="logout" method="post" action="/logout"><button type="submit">Sign out</button></form>
<script>
  document.getElementById('logout').addEventListener('submit', async (e) => {
    e.preventDefault();
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login';
  });
</script>{{end}}
