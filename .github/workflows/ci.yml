name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: check
        run: make check

      - name: proto lint
        run: make proto-lint

      - name: proto generate up to date
        run: make proto-generate
