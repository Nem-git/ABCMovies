# ABCMovies CI — one pipeline definition per milestone (CI-CD.md §1).
#
# Stages map 1:1 to the Makefile recipes (ENVIRONMENT.md §2, §5; CI-CD.md §1):
# the pipeline never invents its own commands, and CI == local. Each stage runs
# on a fresh runner carrying the same toolchain the Containerfile declares
# (ENVIRONMENT.md §3): Go from go.mod (toolchain directive), buf,
# golangci-lint, gitleaks, and node from .tool-versions via mise.
#
# The lint recipe includes the secret-leak scan (`make secret-scan`) — the
# "CI secret-leak gate" THREAT-MODEL.md T12 and CI-CD.md §4 promise.
#
# The fixture stage is the conformance gate (CI-CD.md §2) and must be marked as
# a required status check on main in the repository settings.
#
# The integration stage carries the vault/secrets suite (TESTING.md §6); today
# it is the composed check recipe, and the vault suite will land inside it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  # The milestone whose acceptance criteria gate the next image tag
  # (CI-CD.md §5; IMPLEMENTATION.md §3). Bump this when the milestone ships.
  MILESTONE: m0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            .gomodcache
            .gocache
            ~/.local/share/mise
          key: ${{ runner.os }}-toolchain-${{ hashFiles('go.mod', 'go.sum', '.tool-versions') }}
      - name: Install toolchain (mise)
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise install
      - name: Dependency recipe
        run: make deps
      - name: Schema codegen
        run: make proto
      - name: Lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            .gomodcache
            .gocache
            ~/.local/share/mise
          key: ${{ runner.os }}-toolchain-${{ hashFiles('go.mod', 'go.sum', '.tool-versions') }}
      - name: Install toolchain (mise)
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise install
      - name: Dependency recipe
        run: make deps
      - name: Schema codegen
        run: make proto
      - name: Build
        run: make build

  unit:
    name: Unit + round-trip
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            .gomodcache
            .gocache
            ~/.local/share/mise
          key: ${{ runner.os }}-toolchain-${{ hashFiles('go.mod', 'go.sum', '.tool-versions') }}
      - name: Install toolchain (mise)
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise install
      - name: Dependency recipe
        run: make deps
      - name: Schema codegen
        run: make proto
      - name: Unit + round-trip
        run: make test-unit

  fixtures:
    name: Fixtures (conformance gate)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            .gomodcache
            .gocache
            ~/.local/share/mise
          key: ${{ runner.os }}-toolchain-${{ hashFiles('go.mod', 'go.sum', '.tool-versions') }}
      - name: Install toolchain (mise)
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise install
      - name: Dependency recipe
        run: make deps
      - name: Fixtures
        run: make fixtures

  integration:
    name: Integration (vault/secrets suite)
    runs-on: ubuntu-latest
    needs: [fixtures]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            .gomodcache
            .gocache
            ~/.local/share/mise
          key: ${{ runner.os }}-toolchain-${{ hashFiles('go.mod', 'go.sum', '.tool-versions') }}
      - name: Install toolchain (mise)
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise install
      - name: Check recipe (full gate, never skipped)
        run: make check

  image:
    name: Image (milestone tag)
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Compute image reference
        id: img
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "ref=ghcr.io/${owner,,}/abcmovies:${MILESTONE}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.ref }}
