# E2E test instance config — in-memory stores, fixed port for Playwright.
core:
  api:
    bind: '127.0.0.1:18443'

auth:
  methods:
    - password

slots:
  builtin:
    enabled: true
  providers: []
  sinks:
    - id: device
      adapter: device
      enabled: true

stores:
  caches:
    backend: in-memory
  vault:
    backend: in-memory
    vault-key: generated
  watch-history:
    backend: in-memory
  jobs:
    backend: in-memory
  sessions:
    backend: in-memory
  users:
    backend: in-memory
  source-cache:
    backend: in-memory
