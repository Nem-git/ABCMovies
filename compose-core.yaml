services:
  frontend:
    container_name: frontend
    ports:
      - "5175:5173"
    volumes: # Needed to fix issues with vite and optional dependencies in NPM
      - /srv/www/node_modules
      - /srv/www/.svelte-kit
    networks:
      - nginx-adjacent

  backend:
    container_name: backend
    ports:
      - "8090:8090"
    networks:
      - nginx-adjacent
      - redis-adjacent

  redis:
    container_name: redis
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - nginx-adjacent

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-base
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    networks:
      - nginx-adjacent

networks:
  nginx-adjacent:
    name: nginx-adjacent
  redis-adjacent:
    name: redis-adjacent
