# Working directory
# . or absolute path, please note that the directories following must be under root.
root = "."
tmp_dir = "tmp"

[build]
# When tailwind finishes compiling CSS, send a reload to the browser.
# This fixes the race where templ's auto-reload fires before tailwind is done.
cmd = "go tool templ generate --notify-proxy"
# Customize binary, can setup environment variables when run your app.
full_bin = "true"
# Watch CSS output changes (style.css is written when tailwind finishes).
include_ext = ["css"]
include_dir = ["./internal/web/static"]
# It's not necessary to trigger build each time file changes if it's too frequent.
delay = 500 # ms
# Send Interrupt signal before killing process (ignored on Windows; uses TASKKILL)
send_interrupt = true

[log]
# Show log time
time = false

[misc]
# Delete tmp directory on exit
clean_on_exit = true
# Startup banner text. Set to "" to hide the banner.
# startup_banner = ""

[screen]
clear_on_rebuild = true
keep_scroll = true
