      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/SeriesId'
    get:
      tags:
        - series
      summary: Get series poster
      description: Returns the series poster image in PNG format.
      operationId: getSeriesPoster
      responses:
        '200':
          description: Series poster image
          content:
