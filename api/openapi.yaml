              schema:
                type: string
                format: binary
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Episode Streams ───────────────────────────────────────────────────────

  /services/{serviceTag}/series/{seriesId}/seasons/{seasonId}/episodes/{episodeId}/streams:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/SeriesId'
      - $ref: '#/components/parameters/SeasonId'
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags:
        - episodes
        - streams
      summary: List streams for an episode
      description: |
        Retrieve all available video stream manifests for an episode.
        The listing returns metadata only; fetch the individual file
        endpoint to get the raw manifest bytes.
      operationId: getEpisodeStreams
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
