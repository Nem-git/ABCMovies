      - $ref: '#/components/parameters/SeriesId'
    get:
      tags:
        - series
      summary: Get series backdrop
      description: Returns the series backdrop image in PNG format.
      operationId: getSeriesBackdrop
      responses:
        '200':
          description: Series backdrop image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Seasons ──────────────────────────────────────────────────────────────

  /services/{serviceTag}/series/{seriesId}/seasons:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/SeriesId'
    get:
      tags:
        - seasons
      summary: List seasons for a series
      description: Retrieve all seasons for a given TV series.
      operationId: getSeasons
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of seasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Season'
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Series not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/series/{seriesId}/seasons/{seasonId}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/SeriesId'
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags:
        - seasons
      summary: Get a season
      description: Retrieve a specific season by its identifier.
      operationId: getSeasonById
      responses:
        '200':
          description: A season
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Season not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Season Images ─────────────────────────────────────────────────────────

  /services/{serviceTag}/series/{seriesId}/seasons/{seasonId}/poster.png:
    parameters:
