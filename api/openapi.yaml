openapi: 3.2.0

info:
  title: ABCMovies
  description: |
    This is the API Documentation for ABCMovies, a program that allows people to
    download and stream videos from many different streaming services.

    This specification aims to align with:
      - ISO 3166-1 alpha-2 for countries
      - ISO 639-1 for languages
      - ISO 8601 for durations and dates
      - RFC 3339 for date/time formats
      - schema.org for resource type identification
  version: 0.0.0-alpha

servers:
  - url: http://localhost:80/api/v1alpha
    description: Local development
  - url: https://api.abcmovies.example/v1alpha
    description: Production

tags:
  - name: system
    description: System endpoints (health, etc.)
  - name: services
    description: Streaming service metadata
  - name: movies
    description: Movie resources - self-contained films with no seasons
  - name: series
    description: TV series resources - multi-episode, multi-season content
  - name: seasons
    description: Seasons within a TV series
  - name: episodes
    description: Episodes within a season
  - name: streams
    description: Video stream manifests and playlists
  - name: subtitles
    description: External subtitle files not embedded in stream manifests
  - name: search
    description: Global search across services and titles

paths:

  # --- System ---------------------------------------------------------------

  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Returns the current operational status of the API.
      operationId: getHealth
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Services -------------------------------------------------------------

  /services:
    get:
      tags:
        - Services
      summary: List all streaming services
      description: Retrieve all streaming services offered by the API.
      operationId: getServices
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of streaming services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Service'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
    get:
      tags:
        - Services
      summary: Get a streaming service by tag
      description: Retrieve metadata for a specific streaming service.
      operationId: getServiceByTag
      responses:
        '200':
          description: A streaming service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Movies ---------------------------------------------------------------


  /services/{serviceTag}/movies:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
    get:
      tags:
        - Movies
      summary: List movies on a service
      description: Retrieve all movies available on the given streaming service.
      operationId: getMovies
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of movies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Movie'
        '400':
          description: Invalid service tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
    get:
      tags:
        - Movies
      summary: Get a movie
      description: Retrieve a specific movie by its identifier on the streaming service.
      operationId: getMovieById
      responses:
        '200':
          description: A movie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Movie not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Movie Streams --------------------------------------------------------


  /services/{serviceTag}/movies/{movieId}/streams:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
    get:
      tags:
        - Movies
        - Streams
      summary: List streams for a movie
      description: |
        Retrieve all available video stream manifests (DASH, HLS, etc.)
        for a movie. The listing returns metadata only; fetch the individual
        file endpoint to get the raw manifest bytes.
      operationId: getMovieStreams
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of video stream metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Stream'
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Movie not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/{format}/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/StreamFormat'
      - $ref: '#/components/parameters/StreamFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get a stream manifest file
      description: |
        Returns the raw stream manifest or playlist binary content.
        The response Content-Type matches the stream's encoding format
        (e.g. `application/dash+xml`, `application/vnd.apple.mpegurl`).
      operationId: getMovieStreamFile
      responses:
        '200':
          description: |
            The stream manifest file. Content-Type depends on the stream's
            encoding format.
          content:
            application/dash+xml:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Stream file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/{format}/{rendition}/{segment}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/StreamFormat'
      - $ref: '#/components/parameters/StreamRendition'
      - $ref: '#/components/parameters/StreamSegment'
    get:
      tags:
        - Movies
        - Streams
      summary: Get a stream segment for a movie
      description: |
        Returns a single media segment (HLS .ts/.m4s, DASH .m4s/.mp4)
        or an initialization segment for a given rendition.
      operationId: getMovieStreamSegment
      responses:
        '200':
          description: |
            The media segment binary data. Content-Type is typically
            `video/mp2t` (HLS) or `video/mp4` (DASH).
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Segment not found or state expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Movie HLS Variants ---------------------------------------------------

  /services/{serviceTag}/movies/{movieId}/streams/hls/variants/{variantIndex}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/VariantIndex'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS variant sub-playlist for a movie
      description: |
        Returns a rewritten HLS media playlist for a specific variant.
        The variant is identified by its zero-based index in the master playlist.
        Segment URLs in the response are rewritten to point back to the proxy.
      operationId: getMovieHLSVariant
      responses:
        '200':
          description: Rewritten HLS media playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Variant state not found (master playlist may have expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/hls/variants/{variantIndex}/segments/{segment}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/VariantIndex'
      - $ref: '#/components/parameters/StreamSegment'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS variant segment for a movie
      description: |
        Returns a single media segment from an HLS variant sub-playlist.
        The segment filename is passed through and resolved against the
        upstream base URL stored in state.
      operationId: getMovieHLSVariantSegment
      responses:
        '200':
          description: The media segment binary data
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Segment state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Movie HLS Renditions -------------------------------------------------

  /services/{serviceTag}/movies/{movieId}/streams/hls/renditions/{groupId}/{renditionName}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/RenditionGroupId'
      - $ref: '#/components/parameters/RenditionName'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS rendition sub-playlist for a movie
      description: |
        Returns a rewritten HLS media playlist for a specific rendition
        identified by GROUP-ID and NAME. Typically used for audio or
        subtitle renditions. Segment URLs are rewritten to the proxy.
      operationId: getMovieHLSRendition
      responses:
        '200':
          description: Rewritten HLS media playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rendition state not found (master playlist may have expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/hls/renditions/{groupId}/{renditionName}/segments/{segment}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/RenditionGroupId'
      - $ref: '#/components/parameters/RenditionName'
      - $ref: '#/components/parameters/StreamSegment'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS rendition segment for a movie
      description: |
        Returns a single media segment from an HLS rendition sub-playlist.
      operationId: getMovieHLSRenditionSegment
      responses:
        '200':
          description: The media segment binary data
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Segment state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Movie HLS Variant Resources (Keys, Partials, Preload Hints) -----------

  /services/{serviceTag}/movies/{movieId}/streams/hls/variants/{variantIndex}/keys/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/VariantIndex'
      - $ref: '#/components/parameters/HLSKeyFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS encryption key for a movie variant
      description: |
        Returns an AES-128 encryption key from a variant sub-playlist.
        The key file is fetched from the upstream CDN and proxied through.
      operationId: getMovieVariantKey
      responses:
        '200':
          description: The encryption key binary data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Key state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/hls/variants/{variantIndex}/partials/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/VariantIndex'
      - $ref: '#/components/parameters/HLSResourceFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS partial segment for a movie variant
      description: |
        Returns a low-latency HLS partial segment (EXT-X-PART)
        from a variant sub-playlist. Fetched from the upstream CDN.
      operationId: getMovieVariantPartial
      responses:
        '200':
          description: The partial segment binary data
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/mp2t:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Partial segment state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/hls/variants/{variantIndex}/preload-hints/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/VariantIndex'
      - $ref: '#/components/parameters/HLSResourceFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS preload hint for a movie variant
      description: |
        Returns the resource referenced by an EXT-X-PRELOAD-HINT tag
        from a variant sub-playlist. Fetched from the upstream CDN.
      operationId: getMovieVariantPreloadHint
      responses:
        '200':
          description: The preload hint binary data
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/mp2t:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Preload hint state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Movie HLS Rendition Resources (Keys, Partials, Preload Hints) ---------

  /services/{serviceTag}/movies/{movieId}/streams/hls/renditions/{groupId}/{renditionName}/keys/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/RenditionGroupId'
      - $ref: '#/components/parameters/RenditionName'
      - $ref: '#/components/parameters/HLSKeyFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS encryption key for a movie rendition
      description: |
        Returns an AES-128 encryption key from a rendition sub-playlist.
        The key file is fetched from the upstream CDN and proxied through.
      operationId: getMovieRenditionKey
      responses:
        '200':
          description: The encryption key binary data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Key state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/hls/renditions/{groupId}/{renditionName}/partials/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/RenditionGroupId'
      - $ref: '#/components/parameters/RenditionName'
      - $ref: '#/components/parameters/HLSResourceFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS partial segment for a movie rendition
      description: |
        Returns a low-latency HLS partial segment (EXT-X-PART)
        from a rendition sub-playlist. Fetched from the upstream CDN.
      operationId: getMovieRenditionPartial
      responses:
        '200':
          description: The partial segment binary data
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/mp2t:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Partial segment state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/hls/renditions/{groupId}/{renditionName}/preload-hints/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/RenditionGroupId'
      - $ref: '#/components/parameters/RenditionName'
      - $ref: '#/components/parameters/HLSResourceFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS preload hint for a movie rendition
      description: |
        Returns the resource referenced by an EXT-X-PRELOAD-HINT tag
        from a rendition sub-playlist. Fetched from the upstream CDN.
      operationId: getMovieRenditionPreloadHint
      responses:
        '200':
          description: The preload hint binary data
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/mp2t:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Preload hint state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Movie HLS Master Resources (Session Keys, Session Data, Steering) -----

  /services/{serviceTag}/movies/{movieId}/streams/hls/session-keys/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/HLSKeyFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS session key for a movie
      description: |
        Returns an encryption key declared in an EXT-X-SESSION-KEY tag
        in the master playlist. Fetched from the upstream CDN and proxied through.
      operationId: getMovieHLSSessionKey
      responses:
        '200':
          description: The session key binary data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session key state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/hls/session-data/{file}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/HLSResourceFile'
    get:
      tags:
        - Movies
        - Streams
      summary: Get an HLS session data resource for a movie
      description: |
        Returns the resource referenced by an EXT-X-SESSION-DATA tag.
        Fetched from the upstream CDN and proxied through.
      operationId: getMovieHLSSessionData
      responses:
        '200':
          description: The session data file
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session data state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/hls/steering:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
    get:
      tags:
        - Movies
        - Streams
      summary: Get the HLS content steering manifest for a movie
      description: |
        Returns the content steering manifest referenced by an
        EXT-X-CONTENT-STEERING tag. Fetched from the upstream steering
        server and proxied through.
      operationId: getMovieHLSSteering
      responses:
        '200':
          description: The content steering manifest
          content:
            application/json:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Steering state not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
