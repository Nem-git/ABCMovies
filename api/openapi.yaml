            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Episode Images ────────────────────────────────────────────────────────

  /services/{serviceTag}/series/{seriesId}/seasons/{seasonId}/episodes/{episodeId}/thumbnail.png:
