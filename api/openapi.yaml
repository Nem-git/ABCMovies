openapi: 3.1.0

info:
  title: ABCMovies
  description: |
    This is the API Documentation for ABCMovies, a program that allows people to
    download and stream videos from many different streaming services.

    This specification aims to align with:
      - ISO 3166-1 alpha-2 for countries
      - ISO 639-1 for languages
      - ISO 8601 for durations and dates
      - RFC 3339 for date/time formats
      - schema.org for resource type identification
  version: 0.0.0-alpha

servers:
  - url: http://localhost:80/api/v1alpha
    description: Local development
  - url: https://api.abcmovies.example/v1alpha
    description: Production

tags:
  - name: system
    description: System endpoints (health, etc.)
  - name: services
    description: Streaming service metadata
  - name: movies
    description: Movie resources — self-contained films with no seasons
  - name: series
    description: TV series resources — multi-episode, multi-season content
  - name: seasons
    description: Seasons within a TV series
  - name: episodes
    description: Episodes within a season
  - name: streams
    description: Video stream manifests and playlists
  - name: subtitles
    description: External subtitle files not embedded in stream manifests
  - name: search
    description: Global search across services and titles

paths:

  # ─── System ───────────────────────────────────────────────────────────────

  /health:
    get:
      tags:
        - system
      summary: Health check
      description: Returns the current operational status of the API.
      operationId: getHealth
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  # ─── Services ─────────────────────────────────────────────────────────────

  /services:
    get:
      tags:
        - services
      summary: List all streaming services
      description: Retrieve all streaming services offered by the API.
      operationId: getServices
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of streaming services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Service'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
    get:
      tags:
        - services
      summary: Get a streaming service by tag
      description: Retrieve metadata for a specific streaming service.
      operationId: getServiceByTag
      responses:
        '200':
          description: A streaming service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Movies ───────────────────────────────────────────────────────────────

  /services/{serviceTag}/movies:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
    get:
      tags:
        - movies
      summary: List movies on a service
      description: Retrieve all movies available on the given streaming service.
      operationId: getMovies
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of movies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Movie'
        '400':
          description: Invalid service tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
    get:
      tags:
        - movies
      summary: Get a movie
      description: Retrieve a specific movie by its identifier on the streaming service.
      operationId: getMovieById
      responses:
        '200':
          description: A movie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Movie not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Movie Streams ─────────────────────────────────────────────────────────

  /services/{serviceTag}/movies/{movieId}/streams:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
    get:
      tags:
        - movies
        - streams
      summary: List streams for a movie
      description: |
        Retrieve all available video stream manifests (DASH, HLS, etc.)
        for a movie. The listing returns metadata only; fetch the individual
        file endpoint to get the raw manifest bytes.
      operationId: getMovieStreams
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of video stream metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Stream'
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Movie not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/streams/{streamFile}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/StreamFile'
    get:
      tags:
        - movies
        - streams
      summary: Get a stream manifest file
      description: |
        Returns the raw stream manifest or playlist binary content.
        The response Content-Type matches the stream's encoding format
        (e.g. `application/dash+xml`, `application/vnd.apple.mpegurl`).
      operationId: getMovieStreamFile
      responses:
        '200':
          description: |
            The stream manifest file. Content-Type depends on the stream's
            encoding format.
          content:
            application/dash+xml:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Stream file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Movie Subtitles ───────────────────────────────────────────────────────

  /services/{serviceTag}/movies/{movieId}/subtitles:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
    get:
      tags:
        - movies
        - subtitles
      summary: List external subtitles for a movie
      description: |
        Retrieve all external subtitle files available for a movie.
        Only subtitles that exist as standalone sidecar files are listed here;
        subtitles embedded in stream manifests are not duplicated.
      operationId: getMovieSubtitles
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of subtitle metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Subtitle'
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Movie not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/subtitles/{subtitleFile}:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
      - $ref: '#/components/parameters/SubtitleFile'
    get:
      tags:
        - movies
        - subtitles
      summary: Get a subtitle file
      description: |
        Returns the raw subtitle file content.
        The response Content-Type matches the subtitle format
        (e.g. `text/vtt`, `application/x-subrip`).
      operationId: getMovieSubtitleFile
      responses:
        '200':
          description: The subtitle file
          content:
            text/vtt:
              schema:
                type: string
                format: binary
            application/x-subrip:
              schema:
                type: string
                format: binary
            application/ttml+xml:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Subtitle file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Movie Images ─────────────────────────────────────────────────────────

  /services/{serviceTag}/movies/{movieId}/poster.png:
    parameters:
      - $ref: '#/components/parameters/ServiceTag'
      - $ref: '#/components/parameters/MovieId'
    get:
      tags:
        - movies
      summary: Get movie poster
      description: Returns the movie poster image in PNG format.
      operationId: getMoviePoster
      responses:
        '200':
          description: Movie poster image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{serviceTag}/movies/{movieId}/backdrop.png:
    parameters:
