name: abcmovies

services:
  dev:
    build:
      target: dev
    container_name: dev
    env_file:
      - config/.env
    ports:
      - '80:7331'
    # Sync modified files to rebuild app
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
        # Rebuild container if config or deps files changed
        - action: rebuild
          path: go.mod
        - action: rebuild
          path: go.sum
        - action: rebuild
          path: config/air/*.toml
    profiles: [ dev ]

  prod:
    build:
      target: prod
    container_name: prod
    env_file:
      - config/.env
    ports:
      - '80:80'
    restart: unless-stopped
    profiles: [ prod ]

  testing:
    build:
      target: testing
    container_name: testing
    env_file:
      - config/.env
    profiles: [ testing ]
