version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/nem-git/abcmovies/core/gen
plugins:
  - local: protoc-gen-go
    out: core/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: core/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
inputs:
  - directory: proto
